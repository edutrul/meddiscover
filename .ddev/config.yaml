name: meddiscover
type: drupal11
docroot: web
php_version: "8.4"
webserver_type: nginx-fpm
xdebug_enabled: false
additional_hostnames: []
additional_fqdns: []
database:
    type: postgres
    version: "17"
dbimage_extra_packages: [postgresql-17-pgvector]
use_dns_when_possible: true
timezone: America/Lima
composer_version: "2"
web_environment: []
corepack_enable: true
ddev_version_constraint: '>= v1.25.2'

fail_on_hook_fail: true
hooks:
    post-start:
        - exec: psql -h db -U db -d db -v ON_ERROR_STOP=1 -f /var/www/html/scripts/foundation/extensions.sql
