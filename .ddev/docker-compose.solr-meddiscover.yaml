# medDiscover overrides for the ddev/ddev-solr add-on (installed at 0.9.0).
# - Pin the Solr image for reproducibility (Search API Solr 4.4 supports 9.x).
# - Log warnings only: Solr's default INFO request log records query text,
#   which would break the search privacy rule (no query text in logs).
# - Disable the Jetty request log, which records request URLs with queries.
services:
  solr:
    image: solr:9.11.0-${DDEV_SITENAME}-built
    build:
      args:
        SOLR_BASE_IMAGE: solr:9.11.0
    environment:
      SOLR_LOG_LEVEL: WARN
      SOLR_REQUESTLOG_ENABLED: "false"
