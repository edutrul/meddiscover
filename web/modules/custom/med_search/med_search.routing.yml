med_search.semantic:
  path: '/search/semantic'
  defaults:
    _form: '\Drupal\med_search\Form\SearchForm'
    _title: 'Semantic search'
    strategy: semantic
  requirements:
    _permission: 'access content'
med_search.lexical:
  path: '/search/lexical'
  defaults:
    _form: '\Drupal\med_search\Form\SearchForm'
    _title: 'Keyword search'
    strategy: lexical
  requirements:
    _permission: 'access content'
med_search.hybrid:
  path: '/search/hybrid'
  defaults:
    _form: '\Drupal\med_search\Form\SearchForm'
    _title: 'Hybrid search'
    strategy: hybrid
  requirements:
    _permission: 'access content'
med_search.conversational:
  path: '/search/conversational'
  defaults:
    _form: '\Drupal\med_search\Form\SearchForm'
    _title: 'Ask a health question'
    strategy: conversational
  requirements:
    _permission: 'access content'
med_search.build:
  path: '/how-it-was-built'
  defaults:
    _controller: '\Drupal\med_search\Controller\BuildOverview::page'
    _title: 'How medDiscover was built'
  requirements:
    _permission: 'access content'
med_search.compare:
  path: '/search/compare'
  defaults:
    _form: '\Drupal\med_search\Form\CompareSearchForm'
    _title: 'Compare search modes'
  requirements:
    _permission: 'access content'
