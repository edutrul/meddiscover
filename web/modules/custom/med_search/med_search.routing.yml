med_search.semantic:
  path: '/search/semantic'
  defaults:
    _form: '\Drupal\med_search\Form\SearchForm'
    _title: 'Semantic search'
    strategy: semantic
  requirements:
    _permission: 'access content'
med_search.lexical:
  path: '/search/lexical'
  defaults:
    _form: '\Drupal\med_search\Form\SearchForm'
    _title: 'Keyword search'
    strategy: lexical
  requirements:
    _permission: 'access content'
med_search.hybrid:
  path: '/search/hybrid'
  defaults:
    _form: '\Drupal\med_search\Form\SearchForm'
    _title: 'Hybrid search'
    strategy: hybrid
  requirements:
    _permission: 'access content'
med_search.conversational:
  path: '/search/conversational'
  defaults:
    _form: '\Drupal\med_search\Form\SearchForm'
    _title: 'Ask medDiscover'
    strategy: conversational
  requirements:
    _permission: 'access content'
