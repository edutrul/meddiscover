services:
  med_search.solr_debug:
    class: Drupal\med_search\SolrDebugSubscriber
    tags: [{ name: event_subscriber }]
  med_search.embedder:
    class: Drupal\med_search\OllamaEmbedder
    arguments: ['@http_client', '@config.factory']
  med_search.search:
    class: Drupal\med_search\SemanticSearch
    arguments: ['@database', '@entity_type.manager', '@med_search.embedder', '@config.factory', '@lock', '@datetime.time', '@current_user']
  med_search.enricher:
    class: Drupal\med_search\ResultEnricher
    arguments: ['@entity_type.manager', '@current_user']
    calls: [[setStringTranslation, ['@string_translation']]]
  med_search.generator:
    class: Drupal\med_search\OllamaGenerator
    arguments: ['@http_client', '@config.factory']
  Drupal\med_search\GeneratorInterface: '@med_search.generator'
  med_search.urgency:
    class: Drupal\med_search\UrgencyDetector

  # Search strategies: every service tagged med_search.strategy is collected
  # by med_search.strategies and reachable by its id().
  med_search.strategies:
    class: Drupal\med_search\SearchStrategyRegistry
    tags:
      - { name: service_collector, tag: med_search.strategy, call: addStrategy }
  med_search.strategy.semantic:
    class: Drupal\med_search\SemanticStrategy
    arguments: ['@med_search.search']
    calls: [[setStringTranslation, ['@string_translation']]]
    tags: [{ name: med_search.strategy }]
  med_search.strategy.lexical:
    class: Drupal\med_search\LexicalSearch
    arguments: ['@entity_type.manager', '@config.factory', '@plugin.manager.search_api.parse_mode', '@current_user']
    calls: [[setStringTranslation, ['@string_translation']]]
    tags: [{ name: med_search.strategy }]
  med_search.strategy.hybrid:
    class: Drupal\med_search\HybridSearch
    factory: ['Drupal\med_search\HybridSearch', 'create']
    arguments: ['@med_search.strategy.lexical', '@med_search.strategy.semantic', '@config.factory']
    calls: [[setStringTranslation, ['@string_translation']]]
    tags: [{ name: med_search.strategy }]
  med_search.strategy.conversational:
    class: Drupal\med_search\ConversationalSearch
    factory: ['Drupal\med_search\ConversationalSearch', 'create']
    arguments: ['@med_search.strategy.semantic', '@med_search.strategy.lexical', '@med_search.strategy.hybrid', '@med_search.generator', '@med_search.urgency', '@config.factory']
    calls: [[setStringTranslation, ['@string_translation']]]
    tags: [{ name: med_search.strategy }]
