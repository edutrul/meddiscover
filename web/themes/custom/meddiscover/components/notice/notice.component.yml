$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Notice
status: stable
description: A short, non-dismissable notice such as the educational disclaimer or attribution.
props:
  type: object
  properties:
    attributes:
      type: Drupal\Core\Template\Attribute
    variant:
      type: string
      title: Variant
      enum: [info, warning]
      default: info
    heading:
      type: string
      title: Heading
slots:
  content:
    title: Content
