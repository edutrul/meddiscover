name: Foundation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ddev/github-action-setup-ddev@222a22f69087994aeb075fd87c45a8c8cd61ae76
        with:
          version: 1.25.2
          autostart: false
      - name: Validate publication boundaries
        run: python3 scripts/foundation/check_publication.py
      - name: Start PostgreSQL and install dependencies
        run: |
          ddev start
          ddev composer install --no-interaction --prefer-dist
          ddev composer validate --strict
          ddev composer audit
          ddev exec vendor/bin/phpcs
      - name: Install from exported configuration
        run: |
          # Suppress installer output because it may contain a generated password.
          ddev drush site:install --existing-config --account-name=admin --account-mail=admin@example.invalid -y > /tmp/med-install.log 2>&1 || { sed '/[Pp]ass/d' /tmp/med-install.log; exit 1; }
          ddev drush php:script scripts/foundation/check.php
          ddev exec php -l scripts/foundation/check.php
          ddev exec php -l web/sites/default/settings.php
          ddev drush config:export -y
          git diff --exit-code -- config/sync
          curl --fail --silent --show-error http://meddiscover.ddev.site/user/login > /dev/null
      - name: Create the Solr collection from exported configuration
        run: |
          ddev drush solr-upload-conf med_solr --numShards=1
          ddev drush php:eval 'if (!\Drupal\search_api\Entity\Server::load("med_solr")->isAvailable()) { throw new RuntimeException("Solr unavailable"); } echo "Solr collection available\n";'
      - name: Validate synthetic content migrations
        run: |
          ddev drush php:script scripts/migration/test_fixture.php
          ddev exec php -l web/modules/custom/med_content/src/Corpus.php
          ddev exec php -l web/modules/custom/med_content/src/Plugin/migrate/source/MedXml.php
      - name: Validate semantic retrieval with synthetic vectors
        run: |
          ddev drush php:script scripts/search/test.php
          ddev exec php -l web/modules/custom/med_search/med_search.install
      - name: Validate deterministic result enrichment
        run: ddev drush php:script scripts/search/test_enrichment.php
      - name: Validate lexical search, RRF and hybrid retrieval
        run: |
          ddev drush php:script scripts/search/test_hybrid.php
          ddev exec -s solr bash -c '! grep -rlq "Synthetic Topic One" /var/solr/logs'
      - name: Validate conversational search grounding and safety contract
        run: ddev drush php:script scripts/search/test_conversation.php
      - name: Validate activation rules and calls to action
        run: ddev drush php:script scripts/activation/test_activation.php
      - name: Validate privacy-preserving analytics
        run: ddev drush php:script scripts/analytics/test_analytics.php
      - name: Validate the search UI contract
        run: ddev drush php:script scripts/ui/test_ui.php
